name: Build postmarketOS Ugglite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 openssl expect \
            parted dosfstools e2fsprogs \
            util-linux mount cpio xz-utils \
            gzip tar rsync kpartx multipath-tools

      - name: Checkout pmbootstrap
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$GITHUB_WORKSPACE/pmbootstrap"

      - name: Checkout pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$GITHUB_WORKSPACE/pmaports"

      - name: Install pmbootstrap
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$GITHUB_WORKSPACE/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Configure pmbootstrap (non-interactive)
        env:
          PMOS_APORTS: ${{ github.workspace }}/pmaports
          PMOS_WORK: /home/runner/.local/var/pmbootstrap
        run: |
          mkdir -p "$PMOS_WORK"

          pmbootstrap -y config aports "$PMOS_APORTS"
          pmbootstrap -y config work "$PMOS_WORK"
          pmbootstrap -y config device qcom-msm89x7
          pmbootstrap -y config ui phosh
          pmbootstrap -y config service_manager systemd
          pmbootstrap -y config locale C.UTF-8
          pmbootstrap -y config hostname qcom-msm89x7
          pmbootstrap -y config user dev
          pmbootstrap -y config boot_size 512
          pmbootstrap -y config extra_space 0
          pmbootstrap -y config jobs 4
          pmbootstrap -y config ssh_keys False

      - name: Show configuration
        run: |
          pmbootstrap status
          echo
          pmbootstrap config

      - name: Verify Ugglite support
        run: |
          echo "=== UGGLITE REFERENCES ==="
          find "$GITHUB_WORKSPACE/pmaports" \
            \( -iname '*ugglite*' -o -path '*qcom-msm89x7*' \) \
            -print | head -100

      - name: Build installation
        run: |
          pmbootstrap -y install \
            --no-sshd \
            --no-firewall \
            --filesystem=ext4

      - name: Export images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/export"
          pmbootstrap export "$GITHUB_WORKSPACE/export"

      - name: List output
        if: always()
        run: |
          echo "=== EXPORTED FILES ==="
          find "$GITHUB_WORKSPACE/export" \
            -type f \
            -printf '%p %s bytes\n' 2>/dev/null || true

          echo
          echo "=== IMAGE FILES ==="
          find "$HOME/.local/var/pmbootstrap" \
            -type f \
            \( -name "*.img" -o -name "*.zip" -o -name "boot.img" \) \
            -printf '%p %s bytes\n' 2>/dev/null | head -100 || true

      - name: Upload postmarketOS build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-ugglite-build
          path: |
            export/**
          if-no-files-found: error
          retention-days: 7
