name: Build postmarketOS Ugglite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 openssl \
            parted dosfstools e2fsprogs \
            util-linux mount cpio xz-utils \
            gzip tar rsync \
            kpartx multipath-tools

      - name: Checkout pmbootstrap
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$GITHUB_WORKSPACE/pmbootstrap"

      - name: Checkout pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$GITHUB_WORKSPACE/pmaports"

      - name: Install pmbootstrap
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$GITHUB_WORKSPACE/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Create pmbootstrap config
        run: |
          mkdir -p "$HOME/.config"

          cat > "$HOME/.config/pmbootstrap_v3.cfg" <<EOF2
          [pmbootstrap]
          aports = $GITHUB_WORKSPACE/pmaports
          device = qcom-msm89x7
          kernel = mainline
          ui = phosh
          service_manager = systemd
          user = dev
          locale = C.UTF-8
          hostname = qcom-msm89x7
          boot_size = 512
          extra_space = 0
          jobs = 4
          ccache_size = 0
          build_pkgs_on_install = True
          is_default_channel = True
          timezone = GMT
          work = $HOME/.local/var/pmbootstrap
          EOF2

          echo "=== CONFIG ==="
          cat "$HOME/.config/pmbootstrap_v3.cfg"

      - name: Check configuration
        run: |
          pmbootstrap status
          echo
          echo "=== CONFIG VALUES ==="
          pmbootstrap config aports
          pmbootstrap config device
          pmbootstrap config kernel
          pmbootstrap config ui
          pmbootstrap config service_manager
          pmbootstrap config work

      - name: Check Ugglite device
        run: |
          echo "=== UGGLELITE REFERENCES ==="
          find "$GITHUB_WORKSPACE/pmaports" \
            \( -iname '*ugglite*' -o -path '*qcom-msm89x7*' \) \
            -print | head -100

      - name: Build installation
        run: |
          pmbootstrap install \
            --no-sshd \
            --no-firewall \
            --filesystem=ext4

      - name: Export images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/export"
          pmbootstrap export "$GITHUB_WORKSPACE/export"

      - name: List output
        run: |
          echo "=== EXPORTED FILES ==="
          find "$GITHUB_WORKSPACE/export" \
            -type f \
            -printf '%p %s bytes\n'

          echo
          echo "=== IMAGE FILES ==="
          find "$HOME/.local/var/pmbootstrap" \
            -type f \
            \( -name "*.img" -o -name "*.zip" -o -name "boot.img" \) \
            -printf '%p %s bytes\n' | head -100

      - name: Upload postmarketOS build
        uses: actions/upload-artifact@v4
        with:
          name: pmos-ugglite-build
          path: |
            export/**
          if-no-files-found: error
          retention-days: 7
