name: Build postmarketOS Ugglite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 openssl expect \
            parted dosfstools e2fsprogs \
            util-linux mount cpio xz-utils \
            gzip tar rsync kpartx multipath-tools

      - name: Checkout pmbootstrap
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$GITHUB_WORKSPACE/pmbootstrap"

      - name: Checkout pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$GITHUB_WORKSPACE/pmaports"

      - name: Install pmbootstrap
        run: |
          mkdir -p "$HOME/.local/bin"

          ln -sf \
            "$GITHUB_WORKSPACE/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          pmbootstrap --version

      - name: Initialize pmbootstrap
        env:
          PMOS_APORTS: ${{ github.workspace }}/pmaports
          PMOS_WORK: /home/runner/.local/var/pmbootstrap
        run: |
          mkdir -p "$PMOS_WORK"

          cat > /tmp/init.exp <<'EXPECT'
          set timeout 30
          log_user 1

          spawn pmbootstrap init

          expect {
            -re {Work path.*: *$} {
              send -- "$env(PMOS_WORK)\r"
            }
            timeout {
              puts "\nERROR: Timed out waiting for Work path prompt"
              exit 10
            }
            eof {
              puts "\nERROR: pmbootstrap exited before Work path"
              exit 11
            }
          }

          expect {
            -re {pmaports.*: *$} {
              send -- "$env(PMOS_APORTS)\r"
            }
            timeout {
              puts "\nERROR: Timed out waiting for pmaports prompt"
              exit 12
            }
            eof {
              puts "\nERROR: pmbootstrap exited before pmaports"
              exit 13
            }
          }

          expect {
            -re {Channel \[.*\]: *$} {
              send -- "edge\r"
            }
            timeout {
              puts "\nERROR: Timed out waiting for channel prompt"
              exit 14
            }
            eof {
              puts "\nERROR: pmbootstrap exited before channel"
              exit 15
            }
          }

          expect {
            -re {Device.*: *$} {
              send -- "qcom-msm89x7\r"
            }
            timeout {
              puts "\nERROR: Timed out waiting for device prompt"
              exit 16
            }
            eof {
              puts "\nERROR: pmbootstrap exited before device"
              exit 17
            }
          }

          expect {
            -re {User interface.*: *$} {
              send -- "phosh\r"
            }
            timeout {
              puts "\nERROR: Timed out waiting for UI prompt"
              exit 18
            }
            eof {
              puts "\nERROR: pmbootstrap exited before UI"
              exit 19
            }
          }

          expect {
            -re {Service manager.*: *$} {
              send -- "systemd\r"
            }
            timeout {
              puts "\nERROR: Timed out waiting for service manager"
              exit 20
            }
            eof {
              puts "\nERROR: pmbootstrap exited before service manager"
              exit 21
            }
          }

          expect {
            -re {Locale.*: *$} {
              send -- "C.UTF-8\r"
            }
            timeout {
              puts "\nERROR: Timed out waiting for locale"
              exit 22
            }
            eof {
              puts "\nERROR: pmbootstrap exited before locale"
              exit 23
            }
          }

          expect {
            -re {Hostname.*: *$} {
              send -- "qcom-msm89x7\r"
            }
            timeout {
              puts "\nERROR: Timed out waiting for hostname"
              exit 24
            }
            eof {
              puts "\nERROR: pmbootstrap exited before hostname"
              exit 25
            }
          }

          expect {
            -re {Username.*: *$} {
              send -- "dev\r"
            }
            timeout {
              puts "\nERROR: Timed out waiting for username"
              exit 26
            }
            eof {
              puts "\nERROR: pmbootstrap exited before username"
              exit 27
            }
          }

          expect {
            eof {
              puts "\n=== pmbootstrap init finished ==="
            }
            timeout {
              puts "\nERROR: Unexpected prompt after username"
              puts "The exact prompt above is needed to continue."
              exit 28
            }
          }

          catch wait result
          exit [lindex $result 3]
          EXPECT

          expect /tmp/init.exp

      - name: Show configuration
        run: |
          pmbootstrap status
          echo
          pmbootstrap config

      - name: Verify Ugglite support
        run: |
          echo "=== UGGLITE REFERENCES ==="

          find "$GITHUB_WORKSPACE/pmaports" \
            \( \
              -iname '*ugglite*' \
              -o -path '*qcom-msm89x7*' \
            \) \
            -print | head -100

          echo
          echo "=== UGGLITE DTB ==="

          grep -R \
            "msm8917-xiaomi-ugglite" \
            "$GITHUB_WORKSPACE/pmaports" \
            2>/dev/null | head -20 || true

      - name: Build installation
        run: |
          pmbootstrap install \
            --no-sshd \
            --no-firewall \
            --filesystem=ext4

      - name: Export images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/export"

          pmbootstrap export \
            "$GITHUB_WORKSPACE/export"

      - name: List output
        if: always()
        run: |
          echo "=== EXPORTED FILES ==="

          find "$GITHUB_WORKSPACE/export" \
            -type f \
            -printf '%p %s bytes\n' \
            2>/dev/null || true

          echo
          echo "=== IMAGE FILES ==="

          find "$HOME/.local/var/pmbootstrap" \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.zip" \
              -o -name "boot.img" \
            \) \
            -printf '%p %s bytes\n' \
            2>/dev/null | head -100 || true

      - name: Upload postmarketOS build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-ugglite-build
          path: |
            export/**
          if-no-files-found: error
          retention-days: 7
