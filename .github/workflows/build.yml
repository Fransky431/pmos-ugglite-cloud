name: Build postmarketOS Ugglite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 openssl \
            parted dosfstools e2fsprogs \
            util-linux mount cpio xz-utils \
            gzip tar rsync kpartx multipath-tools

      - name: Checkout pmbootstrap
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$GITHUB_WORKSPACE/pmbootstrap"

      - name: Checkout pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$GITHUB_WORKSPACE/pmaports"

      - name: Install pmbootstrap
        run: |
          mkdir -p "$HOME/.local/bin"

          ln -sf \
            "$GITHUB_WORKSPACE/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          pmbootstrap --version

      - name: Initialize pmbootstrap
        env:
          PMOS_APORTS: ${{ github.workspace }}/pmaports
          PMOS_WORK: /home/runner/.local/var/pmbootstrap
        run: |
          mkdir -p "$PMOS_WORK"

          {
            printf '%s\n' "$PMOS_WORK"
            printf '%s\n' "$PMOS_APORTS"
            printf '%s\n' "edge"
            printf '%s\n' "qcom"
            printf '%s\n' "msm89x7"
            printf '%s\n' "dev"

            # Accept all provider defaults.
            for i in $(seq 1 20); do
              printf '\n'
            done
          } | timeout 180 pmbootstrap init

      - name: Show configuration
        run: |
          pmbootstrap status
          echo
          pmbootstrap config

      - name: Verify Ugglite support
        run: |
          echo "=== PMAPORTS DEVICE REFERENCES ==="

          find "$GITHUB_WORKSPACE/pmaports" \
            \( \
              -iname '*ugglite*' \
              -o -path '*qcom-msm89x7*' \
            \) \
            -print | head -100

          echo
          echo "=== UGGLITE DTB REFERENCES ==="

          grep -R \
            "msm8917-xiaomi-ugglite" \
            "$GITHUB_WORKSPACE/pmaports" \
            2>/dev/null | head -20 || true

      - name: Build installation
        run: |
          pmbootstrap install \
            --no-sshd \
            --no-firewall \
            --filesystem=ext4

      - name: Export images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/export"
          pmbootstrap export "$GITHUB_WORKSPACE/export"

      - name: List output
        if: always()
        run: |
          echo "=== EXPORTED FILES ==="

          find "$GITHUB_WORKSPACE/export" \
            -type f \
            -printf '%p %s bytes\n' \
            2>/dev/null || true

          echo
          echo "=== IMAGE FILES ==="

          find "$HOME/.local/var/pmbootstrap" \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.zip" \
              -o -name "boot.img" \
            \) \
            -printf '%p %s bytes\n' \
            2>/dev/null | head -100 || true

      - name: Upload postmarketOS build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-ugglite-build
          path: |
            export/**
          if-no-files-found: error
          retention-days: 7
