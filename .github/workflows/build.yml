name: Build postmarketOS Ugglite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 openssl \
            parted dosfstools e2fsprogs \
            util-linux mount cpio xz-utils \
            gzip tar rsync

      - name: Checkout pmbootstrap
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$GITHUB_WORKSPACE/pmbootstrap"

      - name: Checkout pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketOS.org/postmarketOS/pmaports.git \
            "$GITHUB_WORKSPACE/pmaports"

      - name: Install pmbootstrap
        run: |
          mkdir -p "$HOME/.local/bin"
          ln -sf "$GITHUB_WORKSPACE/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          pmbootstrap --version

      - name: Configure pmbootstrap
        run: |
          pmbootstrap config aports "$GITHUB_WORKSPACE/pmaports"
          pmbootstrap config device qcom-msm89x7
          pmbootstrap config kernel mainline
          pmbootstrap config ui phosh
          pmbootstrap config service_manager systemd
          pmbootstrap config user dev
          pmbootstrap config locale C.UTF-8
          pmbootstrap config hostname qcom-msm89x7
          pmbootstrap config boot_size 512
          pmbootstrap config extra_space 0
          pmbootstrap config jobs 4
          pmbootstrap config ccache_size 0
          pmbootstrap config build_pkgs_on_install true
          pmbootstrap config work "$HOME/.local/var/pmbootstrap"

      - name: Show configuration
        run: |
          echo "=== PMBOOTSTRAP STATUS ==="
          pmbootstrap status || true

          echo
          echo "=== PMBOOTSTRAP CONFIG ==="
          pmbootstrap config

          echo
          echo "=== UGGLITE DEVICE ==="
          find "$GITHUB_WORKSPACE/pmaports" \
            -path '*qcom-msm89x7*' \
            -o -iname '*ugglite*' | head -100

      - name: Build installation
        run: |
          pmbootstrap install \
            --no-sshd \
            --no-firewall \
            --filesystem=ext4

      - name: Export images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/export"
          pmbootstrap export "$GITHUB_WORKSPACE/export"

      - name: List output
        run: |
          echo "=== EXPORTED FILES ==="
          find "$GITHUB_WORKSPACE/export" \
            -type f \
            -printf '%p %s bytes\n'

          echo
          echo "=== ALL IMAGE FILES ==="
          find "$HOME/.local/var/pmbootstrap" \
            -type f \
            \( -name "*.img" -o -name "*.zip" -o -name "boot.img" \) \
            -printf '%p %s bytes\n' | head -100

      - name: Upload postmarketOS build
        uses: actions/upload-artifact@v4
        with:
          name: pmos-ugglite-build
          path: |
            export/**
          if-no-files-found: error
          retention-days: 7
