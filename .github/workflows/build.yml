name: Build postmarketOS Ugglite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 openssl expect \
            parted dosfstools e2fsprogs \
            util-linux mount cpio xz-utils \
            gzip tar rsync kpartx multipath-tools

      - name: Checkout pmbootstrap
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git \
            "$GITHUB_WORKSPACE/pmbootstrap"

      - name: Checkout pmaports
        run: |
          git clone --depth=1 \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git \
            "$GITHUB_WORKSPACE/pmaports"

      - name: Install pmbootstrap
        run: |
          mkdir -p "$HOME/.local/bin"

          ln -sf \
            "$GITHUB_WORKSPACE/pmbootstrap/pmbootstrap.py" \
            "$HOME/.local/bin/pmbootstrap"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          pmbootstrap --version

      - name: Initialize pmbootstrap
        env:
          PMOS_APORTS: ${{ github.workspace }}/pmaports
          PMOS_WORK: /home/runner/.local/var/pmbootstrap
        run: |
          mkdir -p "$PMOS_WORK"

          cat > /tmp/pmbootstrap-init.exp <<'EXPECT'
          set timeout 1200
          log_user 1

          spawn pmbootstrap init

          expect {
            -re {Work path.*: *$} {
              send -- "$env(PMOS_WORK)\r"
              exp_continue
            }

            -re {pmaports.*: *$} {
              send -- "$env(PMOS_APORTS)\r"
              exp_continue
            }

            -re {Channel \[.*\]: *$} {
              send -- "edge\r"
              exp_continue
            }

            -re {Device.*: *$} {
              send -- "qcom-msm89x7\r"
              exp_continue
            }

            -re {User interface.*: *$} {
              send -- "phosh\r"
              exp_continue
            }

            -re {Service manager.*: *$} {
              send -- "systemd\r"
              exp_continue
            }

            -re {Locale.*: *$} {
              send -- "C.UTF-8\r"
              exp_continue
            }

            -re {Hostname.*: *$} {
              send -- "qcom-msm89x7\r"
              exp_continue
            }

            -re {Username.*: *$} {
              send -- "dev\r"
              exp_continue
            }

            eof
          }

          catch wait result
          exit [lindex $result 3]
          EXPECT

          expect /tmp/pmbootstrap-init.exp

      - name: Show configuration
        run: |
          pmbootstrap status
          echo
          pmbootstrap config

      - name: Verify Ugglite support
        run: |
          echo "=== UGGLITE / MSM89X7 REFERENCES ==="

          find "$GITHUB_WORKSPACE/pmaports" \
            \( \
              -iname '*ugglite*' \
              -o -path '*qcom-msm89x7*' \
            \) \
            -print | head -100

          echo
          echo "=== UGLGLITE DTB CHECK ==="

          grep -R \
            "msm8917-xiaomi-ugglite" \
            "$GITHUB_WORKSPACE/pmaports" \
            2>/dev/null | head -20 || true

      - name: Build installation
        run: |
          pmbootstrap install \
            --no-sshd \
            --no-firewall \
            --filesystem=ext4

      - name: Export images
        run: |
          mkdir -p "$GITHUB_WORKSPACE/export"

          pmbootstrap export \
            "$GITHUB_WORKSPACE/export"

      - name: List output
        if: always()
        run: |
          echo "=== EXPORTED FILES ==="

          find "$GITHUB_WORKSPACE/export" \
            -type f \
            -printf '%p %s bytes\n' \
            2>/dev/null || true

          echo
          echo "=== PMBOOTSTRAP IMAGE FILES ==="

          find "$HOME/.local/var/pmbootstrap" \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.zip" \
              -o -name "boot.img" \
            \) \
            -printf '%p %s bytes\n' \
            2>/dev/null | head -100 || true

      - name: Upload postmarketOS build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-ugglite-build
          path: |
            export/**
          if-no-files-found: error
          retention-days: 7
